<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Slider limpio</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        /* Contenedor del slider */
        .simple-carousel {
            height: 480px; /* alto del carrusel */
            border-radius: 24px; /* esquinas redondeadas */
            overflow: hidden; /* respeta el radio */
            box-shadow: 0 10px 25px rgba(0,0,0,.15); /* sombra suave */
        }
            /* Imágenes: rellenan sin deformarse */
            .simple-carousel .carousel-item img {
                height: 100%;
                object-fit: cover;
            }

        /* Flechas solo abajo a la derecha (opcional) */
        .carousel-control-prev,
        .carousel-control-next {
            width: 3.5rem;
            height: 3.5rem;
            top: auto;
            bottom: 1.5rem;
            opacity: 1;
        }

        .carousel-control-prev {
            left: 1.5rem;
        }

        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            filter: invert(1);
        }
        /* blanco */
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        <!-- ===== Slider ===== -->
        <div id="simpleCarousel" class="carousel slide simple-carousel" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <!-- Sustituye la URL por tu imagen -->
                    <img src="https://picsum.photos/id/1015/1200/800" class="w-100" alt="Slide 1">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/id/1025/1200/800" class="w-100" alt="Slide 2">
                </div>
                <div class="carousel-item">
                    <img src="https://picsum.photos/id/1043/1200/800" class="w-100" alt="Slide 3">
                </div>
            </div>

            <!-- Controles -->
            <button class="carousel-control-prev" type="button" data-bs-target="#simpleCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#simpleCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>
        <!-- ===== /Slider ===== -->
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
